name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # १. npm lockfile दुरुस्त करणारी स्टेप
      - name: Install Dependencies
        run: |
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "::warning ::npm ci failed due to lockfile mismatch. Falling back to npm install."
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # २. Missing Gradle wrapper JAR आपोआप तयार करणारी स्टेप
      - name: Ensure Gradle Wrapper Present
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning ::gradle-wrapper.jar is missing. Regenerating Gradle wrapper..."
            cd android || exit 1
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          else
            echo "Gradle wrapper is present"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanjariJodi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
