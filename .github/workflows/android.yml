# Automated Android APK Build Workflow for Vanjari Jodi
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite + Server)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Fix Corrupt Splash/Drawables & Permissions
        run: |
          chmod +x ./android/gradlew
          if [ ! -s ./android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo ./android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9/gradle/wrapper/gradle-wrapper.jar
          fi
          # AAPT2 splash.png क्रॅश रोखण्यासाठी सर्व करप्ट इमेजेस १००% व्हॅलिड PNG ने रिप्लेस करणे
          python3 -c "
          import os, base64
          valid_png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          for root, dirs, files in os.walk('./android/app/src/main/res'):
              for f in files:
                  p = os.path.join(root, f)
                  if f.endswith('.png') and ('splash' in f or os.path.getsize(p) == 0):
                      with open(p, 'wb') as img:
                          img.write(valid_png)
          "

      - name: Build Android APK (Official Signed Release & Universal)
        run: |
          cd android
          # Create official Keystore for Release Signing
          keytool -genkeypair -v -keystore app/release.keystore -alias vanjarijodi -keyalg RSA -keysize 2048 -validity 10000 -storepass vanjari123 -keypass vanjari123 -dname "CN=Vanjari Jodi Matrimony, OU=IT, O=Vanjari Jodi, L=Mumbai, ST=Maharashtra, C=IN"
          
          # Build Release and Debug APKs
          ./gradlew assembleRelease assembleDebug -Pandroid.enablePngCrunchInReleaseBuilds=false --no-daemon --stacktrace
          
          mkdir -p ../dist-apk
          
          # Universal debug APK
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/VanjariJodi-Universal-Install.apk
          
          # Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/VanjariJodi-Official-Release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanjariJodi-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Vanjari Jodi Android App (Latest)"
          body: "📲 **वंजारी जोडी अधिकृत ॲन्ड्रॉइड ॲप्लिकेशन (Direct APK Download)**\n\nकोणत्याही GitHub लॉगिनशिवाय थेट इन्स्टॉल करा."
          draft: false
          prerelease: false
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          
