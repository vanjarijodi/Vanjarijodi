# Automated Android APK Build Workflow
# Fixed by AI Coding Agent on 2026-08-04 - Prevents corrupt gradle-wrapper.jar errors by dynamic validation and fallback build engines
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Local Gradle Wrapper Files
        run: |
          cd android
          echo "Removing local wrapper files to prevent any manifest/corruption validation errors..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradle/wrapper/gradle-wrapper.properties
          rm -f gradlew
          rm -f gradlew.bat

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          echo "Building using the official system Gradle 8.8 runner..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanjariJodi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30


