# Automated Android APK Build Workflow for Vanjari Jodi
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite + Server)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Fix Android Variables & Gradle Wrapper
        run: |
          chmod +x ./android/gradlew
          # Ensure compileSdkVersion and targetSdkVersion match Capacitor 6/7 requirements
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' ./android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' ./android/variables.gradle || true

      - name: Build Android APK (Official Signed Release & Universal)
        run: |
          cd android
          # Create official Keystore for Release Signing
          keytool -genkeypair -v -keystore app/release.keystore -alias vanjarijodi -keyalg RSA -keysize 2048 -validity 10000 -storepass vanjari123 -keypass vanjari123 -dname "CN=Vanjari Jodi Matrimony, OU=IT, O=Vanjari Jodi, L=Mumbai, ST=Maharashtra, C=IN"
          
          # Build Release and Debug APKs
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          
          mkdir -p ../dist-apk
          
          # Universal debug APK
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/VanjariJodi-Universal-Install.apk
          
          # Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/VanjariJodi-Official-Release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanjariJodi-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
          if-no-files-found: error
          
