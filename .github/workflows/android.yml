name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Clean and Download Valid Gradle Wrapper
        run: |
          cd android
          echo "Clearing potentially corrupt local gradle-wrapper.jar..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          echo "Downloading official Gradle 8.8 wrapper jar..."
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar
          
          # Verify integrity
          python3 -c "import zipfile; z = zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar'); assert 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist()" && echo "Verified: gradle-wrapper.jar is fully functional!"
          
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          echo "Attempting build using the local Gradle Wrapper..."
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "Local Gradle Wrapper build failed. Falling back to global Gradle 8.8..."
            gradle assembleDebug --no-daemon --stacktrace
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanjariJodi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30


